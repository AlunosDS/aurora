<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agendamento | Aurora</title>
  <link rel="stylesheet" href="style.css">
  <!-- Estilos migrados para style.css -->
</head>
<body>

  <!-- Botão do menu -->
  <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

  <!-- Sidebar -->
  <div id="menu-root"></div>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- Conteúdo principal -->
  <header class="site-header container">
    <div class="story" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuMV1_8b1pjiHe6lTfRLqUZfOtDOOCGQ4rSA&s');"></div>
    <h1>Unhas em Gel</h1>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="servicos.html">Serviços</a>
      <a href="agendamento.html" class="active">Agendar</a>
      <a href="sobre.html">Sobre</a>
      <a href="perfil.html">Perfil</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>

  <main>
    <h2>Agende seu horário</h2>
    <form id="form-agendamento">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

      <label>Escolha o dia:</label>
      <div class="calendar" id="calendar"></div>

      <label>Escolha o horário:</label>
      <div class="horarios" id="horarios"></div>

      <button type="submit">Confirmar Agendamento</button>
    </form>
  </main>

  <footer>
    © 2025 Aurora — Todos os direitos reservados
  </footer>


  <!-- ===== HELP FORM MODAL ===== -->
  <div id="helpModal" class="help-modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle" aria-describedby="helpDesc">
    <div class="dialog">
      <button id="closeHelpModal" class="close-btn" aria-label="Fechar">✕</button>
      <h3 id="helpTitle">Ajuda</h3>
      <p id="helpDesc">Preencha o formulário abaixo e envie. Você pode compartilhar sua localização para facilitar nossa resposta.</p>
      <form id="helpForm" class="help-form" novalidate>
        <label>Nome (opcional)</label>
        <input id="helpName" type="text" class="form-input" placeholder="Seu nome (opcional)" />
        <label>Descrição</label>
        <textarea id="helpDescription" class="form-textarea" placeholder="Descreva seu problema ou dúvida" required></textarea>
        <div class="form-row">
          <input id="shareLocation" type="checkbox" />
          <label for="shareLocation">Compartilhar localização</label>
          <small id="locationStatus">Nenhuma localização</small>
        </div>
        <input id="helpLat" type="hidden" />
        <input id="helpLng" type="hidden" />
        <div class="form-row end">
          <button type="button" onclick="submitHelpForm()" class="primary">Enviar</button>
          <button type="button" id="cancelHelp" class="secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>


</body>
<script src="script.js"></script>
</html>
