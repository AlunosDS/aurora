<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agendamento | Aurora</title>
  <link rel="stylesheet" href="style.css">
  <!-- Estilos migrados para style.css -->
</head>
<body>


  <!-- Cabeçalho -->
  <header>
    <nav style="text-align:center;">
      <a href="index.html">Início</a> |
      <a href="servicos.html">Serviços</a> |
      <a href="agendamento.html">Agendamento</a> |
      <a href="sobre.html">Sobre</a> |
      <a href="perfil.html">Perfil</a> |
      <a href="login.html">Entrar</a>
      <!-- Botão de Ajuda destacado -->
      <button type="button" class="ajuda-btn" onclick="document.getElementById('helpModal').style.display='flex'">Ajuda</button>
    </nav>
  </header>

  <main class="main">
    <h2>Agende seu horário</h2>
    <form id="form-agendamento">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

      <label for="servicos-group">Selecione o(s) serviço(s):</label>
      <div id="servicos-group" class="servicos-checkbox-group">
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Fibra de Gel nas Unhas"> Fibra de Gel nas Unhas</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Tratamento Capilar"> Tratamento Capilar</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Cortes Femininos"> Cortes Femininos</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Mega Hair"> Mega Hair</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Design de Sobrancelhas"> Design de Sobrancelhas</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Extensão de Cílios"> Extensão de Cílios</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Depilação a laser"> Depilação a laser</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Limpeza de pele"> Limpeza de pele</label>
        <label class="servico-checkbox"><input type="checkbox" name="servicos" value="Massagem"> Massagem</label>
      </div>

      <label>Escolha o dia:</label>
      <div class="calendar" id="calendar"></div>

      <label>Escolha o horário:</label>
      <div class="horarios" id="horarios"></div>

      <button type="submit">Confirmar Agendamento</button>
    </form>
  </main>

  <footer>
    © 2025 Aurora — Todos os direitos reservados
  </footer>


  <!-- ===== HELP FORM MODAL ===== -->
  <div id="helpModal" class="help-modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle" aria-describedby="helpDesc">
    <div class="dialog">
      <button id="closeHelpModal" class="close-btn" aria-label="Fechar">✕</button>
      <h3 id="helpTitle">Ajuda</h3>
      <p id="helpDesc">Preencha o formulário abaixo e envie. Você pode compartilhar sua localização para facilitar nossa resposta.</p>
      <form id="helpForm" class="help-form" novalidate>
        <label>Nome (opcional)</label>
        <input id="helpName" type="text" class="form-input" placeholder="Seu nome (opcional)" />
        <label>Descrição</label>
        <textarea id="helpDescription" class="form-textarea" placeholder="Descreva seu problema ou dúvida" required></textarea>
        <div class="form-row">
          <input id="shareLocation" type="checkbox" />
          <label for="shareLocation">Compartilhar localização</label>
          <small id="locationStatus">Nenhuma localização</small>
        </div>
        <input id="helpLat" type="hidden" />
        <input id="helpLng" type="hidden" />
        <div class="form-row end">
          <button type="button" onclick="submitHelpForm()" class="primary">Enviar</button>
          <button type="button" id="cancelHelp" class="secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>


</body>
<script src="script.js"></script>
</html>
