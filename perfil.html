<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário</title>
  <!-- Estilos migrados para style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header container">
      <a class="site-brand" href="index.html">AURORA</a>
      <nav class="main-nav">
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamento.html">Agendar</a>
        <a href="sobre.html">Sobre</a>
        <a href="perfil.html" class="active">Perfil</a>
        <a href="login.html">Entrar</a>
      </nav>
      <button class="menu-toggle nav-toggle" onclick="toggleMenu()" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    </header>

  <div class="profile-header">
    <label for="upload-photo">
      <div class="profile-pic" id="profilePic" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS65IMshvxIDm6oXhtLRwkAY47NFn31GqVRbw&s');"></div>
    </label>
    <input type="file" id="upload-photo" accept="image/*">

    <h2 id="username">Oliver Decesary</h2>
    <div class="buttons">
      <button onclick="editarPerfil()">Editar Perfil</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab(0)">Feed</div>
    <div class="tab" onclick="showTab(1)">Avaliações</div>
  </div>

  <div class="tab-content" id="tabContent">
    <div id="feed">
      <div class="post">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBr7gDpqq4tc16W1nN0lB0AchwaLAqDo0UOA&s" alt="Post 1">
        <p>Post do usuário</p>
      </div>
      <div class="post">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuadhGtWyh1WFk8MjNfV1sYZG08ozgboAexg&s" alt="Post 2">
        <p>Mais um post</p>
      </div>
    </div>
    <div id="avaliacoes" class="hidden">
      <div class="post">
        <p>⭐️⭐️⭐️⭐️ - Avaliação de um serviço</p>
      </div>
      <div class="post">
        <p>⭐️⭐️⭐️ - Avaliação de outro serviço</p>
      </div>
    </div>
  </div>


</body>
</html>
