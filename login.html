<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aurora — Login e Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Estilos migrados para style.css -->
</head>
<body>
  <header>
    <nav style="text-align:center;">
      <a href="index.html">Início</a> |
      <a href="servicos.html">Serviços</a> |
      <a href="agendamento.html">Agendamento</a> |
      <a href="sobre.html">Sobre</a> |
      <a href="perfil.html">Perfil</a> |
      <a href="login.html">Entrar</a>
      <!-- Botão de Ajuda destacado -->
      <button type="button" class="ajuda-btn" onclick="document.getElementById('helpModal').style.display='flex'">Ajuda</button>
    </nav>
  </header>

  <div class="container main" id="formContainer">
    <h1 id="formTitle">Entrar</h1>
    <p id="formSubtitle">Acesse sua conta Aurora</p>

    <div id="loginForm">
      <label for="loginEmail">Gmail</label>
      <input id="loginEmail" type="email" placeholder="seunome@gmail.com" />
      <div class="spacer"></div>
      <label for="loginSenha">Senha</label>
      <input id="loginSenha" type="password" placeholder="••••••" />
      <div id="loginError" class="error hidden"></div>
      <div id="loginTimer" class="timer hidden"></div>
      <button class="btn" id="btnEntrar" onclick="entrar()">Entrar</button>
      <div class="spacer"></div>
      <button class="toggle" onclick="mostrarCadastro()">Criar uma conta</button>
    </div>

    <div id="cadastroForm" class="hidden">
      <label for="nomeCompleto">Nome completo</label>
      <input id="nomeCompleto" type="text" placeholder="Seu nome completo" />
      <div class="spacer"></div>
      <label for="gmail">Gmail</label>
      <input id="gmail" type="email" placeholder="seunome@gmail.com" />
      <div class="spacer"></div>
      <label for="usuario">Nome de usuário</label>
      <input id="usuario" type="text" placeholder="nome_de_usuario" />
      <div class="spacer"></div>
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="••••••" />
      <div id="senhaError" class="error hidden"></div>
      <button class="btn" onclick="criarConta()">Criar conta</button>
      <div class="spacer"></div>
      <button class="toggle" onclick="mostrarLogin()">Já tenho conta</button>
    </div>
  </div>

  <!-- Modal de Ajuda -->
  <div id="helpModal" class="help-modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle" aria-describedby="helpDesc">
    <div class="dialog">
      <button id="closeHelpModal" class="close-btn" aria-label="Fechar">✕</button>
      <h3 id="helpTitle">Ajuda</h3>
      <p id="helpDesc">Preencha o formulário abaixo e envie. Você pode compartilhar sua localização para facilitar nossa resposta.</p>
      <form id="helpForm" class="help-form" novalidate>
        <label>Nome (opcional)</label>
        <input id="helpName" type="text" class="form-input" placeholder="Seu nome (opcional)" />
        <label>Descrição</label>
        <textarea id="helpDescription" class="form-textarea" placeholder="Descreva seu problema ou dúvida" required></textarea>
        <div class="form-row">
          <input id="shareLocation" type="checkbox" />
          <label for="shareLocation">Compartilhar localização</label>
          <small id="locationStatus">Nenhuma localização</small>
        </div>
        <input id="helpLat" type="hidden" />
        <input id="helpLng" type="hidden" />
        <div class="form-row end">
          <button type="button" onclick="submitHelpForm()" class="primary">Enviar</button>
          <button type="button" id="cancelHelp" class="secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
