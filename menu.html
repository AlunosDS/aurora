<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu Lateral Direito</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
    }

    /* Botão de menu no canto direito */
    .menu-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #c5a78d;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      z-index: 1001;
    }

    /* Menu lateral no lado direito */
    .sidebar {
      position: fixed;
      top: 0;
      right: -260px;
      width: 260px;
      height: 100%;
      background-color: #fefefe;
      box-shadow: -2px 0 8px rgba(0,0,0,0.1);
      padding: 20px;
      transition: right 0.3s ease;
      z-index: 1000;
      border-left: 1px solid #eee;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #5e5047;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      padding: 12px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      color: #5e5047;
      transition: background 0.2s;
    }

    .sidebar ul li:hover {
      background-color: #f3f0ee;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    @media (max-width: 600px) {
      .sidebar {
        width: 80%;
      }
    }
  .sidebar ul li a { display: block; color: inherit; text-decoration: none; }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

  <div class="sidebar" id="sidebar">
    <h2>Menu</h2>
    <ul>
      <li><a href="perfil.html">Perfil</a></li>
      <li><a href="servicos.html">Serviços</a></li>
      <li><a href="agendamento.html">Agendar</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="login.html">Entrar</a></li>
      <li onclick="showHelpForm()">Ajuda</li>
    </ul>
  </div>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
  </script>

</body>
  <!-- ===== HELP FORM MODAL ===== -->
  <div id="helpModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:#fff; width:90%; max-width:520px; padding:20px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.2); position:relative;">
      <button id="closeHelpModal" style="position:absolute; right:12px; top:12px; border:none; background:transparent; font-size:20px; cursor:pointer;">✕</button>
      <h3 style="margin-top:0; color:#5e5047;">Ajuda</h3>
      <p style="color:#666;">Preencha o formulário abaixo e envie. Você pode compartilhar sua localização para facilitar nossa resposta.</p>
      <form id="helpForm" style="display:flex; flex-direction:column; gap:12px; margin-top:8px;">
        <label style="font-weight:600; color:#5e5047;">Nome (opcional)</label>
        <input id="helpName" type="text" placeholder="Seu nome (opcional)" style="padding:12px; border-radius:8px; border:1px solid #eae4e0;" />
        <label style="font-weight:600; color:#5e5047;">Descrição</label>
        <textarea id="helpDescription" placeholder="Descreva seu problema ou dúvida" style="padding:12px; border-radius:8px; border:1px solid #eae4e0; min-height:100px;" required></textarea>
        <div style="display:flex; gap:10px; align-items:center;">
          <input id="shareLocation" type="checkbox" />
          <label for="shareLocation">Compartilhar localização</label>
          <small id="locationStatus" style="color:#666; margin-left:auto;">Nenhuma localização</small>
        </div>
        <input id="helpLat" type="hidden" />
        <input id="helpLng" type="hidden" />
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
          <button type="button" onclick="submitHelpForm()" style="background:#c5a78d; color:white; padding:10px 16px; border-radius:8px; border:none;">Enviar</button>
          <button type="button" id="cancelHelp" style="background:#f3f0ee; border:none; padding:10px 16px; border-radius:8px;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function showHelpForm() {
      const modal = document.getElementById('helpModal');
      modal.style.display = 'flex';
      document.getElementById('helpName').value = '';
      document.getElementById('helpDescription').value = '';
      document.getElementById('helpLat').value = '';
      document.getElementById('helpLng').value = '';
      document.getElementById('shareLocation').checked = false;
      document.getElementById('locationStatus').textContent = 'Nenhuma localização';
    }

    document.getElementById('closeHelpModal').addEventListener('click', () => { document.getElementById('helpModal').style.display = 'none'; });
    document.getElementById('cancelHelp').addEventListener('click', () => { document.getElementById('helpModal').style.display = 'none'; });

    document.getElementById('shareLocation').addEventListener('change', async function() {
      const status = document.getElementById('locationStatus');
      if (this.checked) {
        if (!navigator.geolocation) {
          status.textContent = 'Geolocalização não suportada';
          return;
        }
        status.textContent = 'Aguardando permissão…';
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          document.getElementById('helpLat').value = lat;
          document.getElementById('helpLng').value = lng;
          status.textContent = `Local capturado: ${lat}, ${lng}`;
        }, (err) => {
          status.textContent = 'Permissão negada';
          this.checked = false;
        }, { timeout:10000 });
      } else {
        status.textContent = 'Nenhuma localização';
        document.getElementById('helpLat').value = '';
        document.getElementById('helpLng').value = '';
      }
    });

    function submitHelpForm() {
      const nome = document.getElementById('helpName').value.trim();
      const descricao = document.getElementById('helpDescription').value.trim();
      const lat = document.getElementById('helpLat').value;
      const lng = document.getElementById('helpLng').value;
      if (!descricao) {
        alert('Por favor, preencha a descrição.');
        return;
      }
      let msg = 'Mensagem de Ajuda enviada com sucesso\n\n';
      msg += `Nome: ${nome || '(não informado)'}\n`;
      msg += `Descrição: ${descricao}\n`;
      if (lat && lng) {
        msg += `Localização: ${lat}, ${lng}\n`;
      }
      alert(msg);
      document.getElementById('helpModal').style.display = 'none';
    }
  </script>
</html>
